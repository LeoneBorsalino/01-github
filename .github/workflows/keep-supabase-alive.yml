name: Mantener Supabase activo

# Supabase (plan Free) pausa automáticamente un proyecto tras ~7 días sin
# actividad. Este workflow hace una consulta real a la base cada pocos días
# para que nunca llegue a pausarse entre un evento y otro.
#
# Usa la clave "publishable" (antes "anon"): está pensada para ser pública,
# protegida por Row Level Security — no hace falta guardarla como secret.

on:
  schedule:
    - cron: "0 9 * * 1,4" # lunes y jueves 09:00 UTC — nunca pasan 7 días sin pegarle
  workflow_dispatch: {} # para poder dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de Supabase
        env:
          SUPABASE_URL: https://daexsjcbjgdafaomhglo.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_QfD4Scf2ZqxEJRtlHqw_wA_bOr2gq-y
        run: |
          curl -sS --fail \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/events?select=id&limit=1"
